# Bookuchet production nginx configuration
#
# Install:
#   sudo cp deploy/nginx/bookuchet.conf /etc/nginx/sites-available/bookuchet
#   sudo ln -s /etc/nginx/sites-available/bookuchet /etc/nginx/sites-enabled/bookuchet
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Gunicorn is expected to listen on 127.0.0.1:3005.

server {
    listen 80;
    listen [::]:80;

    # Replace with the real DNS name when one is available.
    # Using "_" also allows access by server IP.
    server_name _;

    root /opt/bookuchet/backend/static;
    index index.html;

    client_max_body_size 16m;

    # Backend API.
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Vite build assets are content-hashed and can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Vue Router history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache the SPA entry point so deployments become visible immediately.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
