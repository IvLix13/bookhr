name: Employee work periods

on:
  pull_request:
    paths:
      - 'backend/app/api/employees.py'
      - 'backend/app/api/schemas.py'
      - 'backend/app/services/employees.py'
      - 'backend/tests/test_employee_periods_form.py'
      - 'frontend/src/components/EmployeeForm.vue'
      - 'frontend/src/components/EmployeeForm.test.ts'
      - 'frontend/src/api/client.ts'
      - 'frontend/src/types/index.ts'
      - '.github/workflows/employee-work-periods.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run employee tests
        working-directory: backend
        run: python -m pytest -q tests/test_employee_periods_form.py tests/test_employees_crud.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test employee form
        working-directory: frontend
        run: npm test -- src/components/EmployeeForm.test.ts
